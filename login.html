<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertice | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
    <script src="https://kit.fontawesome.com/7933cb9d51.js" crossorigin="anonymous"></script>
</head>
<body class="login">
   
    <div class="login-cuadro">  
            <div class="login-izq">
                <div class="login-izq-cuadro">

                    <div class="login-izq-img">
                        <a href="index.html">
                            <img src="./img/LOGO1.png" alt="">
                        </a>
                    </div>

                    <h2 class="pan-caja-titulo">Iniciar Sesión</h2>
                    
                    <div class="login-imput">

                    <label for="usuario">Usuario</label>
                    <input type="text" placeholder="gonza967" id="usuario">

                    <label for="clave">Clave</label>
                    <div class="campo-clave">
                        <input type="password" id="clave">
                        <span class="ojo">◉</span>
                    </div>

                    <div class="opciones">
                        <label class="recordar">
                            <input type="checkbox">
                            Recordar usuario
                        </label>
                    </div>

                    <a class="login-problema" href="#">Tengo problemas para entrar</a>

                    <button class="btn-ingresar">Ingresar</button>

                </div>


                </div>
            </div>
            <div class="bloque-imagen">
                 <img class="imagen-login" src="./img/login-portada-1.jpg" alt="Persona usando laptop">
            </div>
    </div>    
    
    
</body>
</html>
